name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: python3 build.py

      - name: Prepare Pages output
        run: |
          mkdir -p public
          cp build/index.html public/index.html
          cp build/style.css public/style.css
          cp build/app.js public/app.js
          cp -r build/entity public/entity
          cp -r build/event public/event
          cp static/robots.txt public/robots.txt
          cp build/sitemap.xml public/sitemap.xml
          echo "getworldpulse.com" > public/CNAME

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
