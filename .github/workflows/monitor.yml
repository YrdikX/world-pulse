name: 30-minute news monitor

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run monitor (GDELT check, no LLM)
        run: python3 automation/monitor.py

      - name: Commit and push if there are new candidates
        run: |
          git config user.name "world-pulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add automation/candidates.jsonl automation/seen_urls.json
          if ! git diff --cached --quiet; then
            git commit -m "Monitor: update candidates ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          else
            echo "No new candidates this run"
          fi
