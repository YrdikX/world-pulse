name: Deep pass (LLM extraction, every 6 hours)

on:
  schedule:
    - cron: '0 */6 * * *'   # 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run extraction pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 automation/daily_pipeline.py

      - name: Commit and push if there are changes
        run: |
          git config user.name "world-pulse-bot"
          git config user.email "actions@users.noreply.github.com"
          touch automation/pending_edges.jsonl automation/processed_urls.json automation/candidates.jsonl
          git add automation/pending_edges.jsonl automation/processed_urls.json automation/candidates.jsonl
          if ! git diff --cached --quiet; then
            git commit -m "Deep pass: new pending edge(s) for review ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          else
            echo "Nothing new"
          fi
